name: salus
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  auto_route: ^11.2.0
  cloud_firestore: ^6.10.0
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  google_sign_in: ^7.2.0
  json_annotation: ^4.12.0
  logger: ^2.8.0
  pretty_dio_logger: ^1.4.0
  riverpod: ^3.4.3
  toastification: ^3.0.3
  flutter_map: ^7.0.2              
  latlong2: ^0.9.1                   
  geolocator: ^13.0.2              
  flutter_map_location_marker: ^9.0.0 
  flutter_map_marker_cluster: ^1.4.0 
  turf: ^0.0.9                       

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.5.4
  freezed: ^4.0.1
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/salus_logo.png"
  adaptive_icon_background: "#F5F5F0"
  adaptive_icon_foreground: "assets/images/salus_logo_splash.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F5F5F0"
  image: assets/images/salus_logo_splash.png
  android: true
  ios: true
  android_12:
    color: "#F5F5F0"
    image: assets/images/salus_logo_splash.png
